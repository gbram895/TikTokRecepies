services:
  - type: web
    name: tiktok-recipe-transcriber
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: WHISPER_MODEL_SIZE
        value: base
      - key: DATABASE_URL
        fromDatabase:
          name: tiktok-recipe-db
          property: connectionString

databases:
  - name: tiktok-recipe-db
    plan: free
    databaseName: tiktok_recipes
    user: tiktok_recipes
